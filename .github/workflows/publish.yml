name: Publish

# Publishes to npm with provenance whenever a version tag is pushed.
# Uses npm "trusted publishing" (OIDC): no tokens or 2FA codes are stored —
# npmjs.com is configured once to trust this repository + workflow.
# Setup (one time, per package, on npmjs.com → package → Settings →
# Publishing access): Trusted Publisher = GitHub Actions,
# organization "Appky", repository "einvoice", workflow "publish.yml".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish einvoice-kit
        run: npm publish --provenance --access public -w packages/core
      - name: Publish einvoice-kit-mcp
        run: npm publish --provenance --access public -w packages/mcp
